[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koaf"
version = "0.1.1"
description = "Kali OPSEC Automation Framework: privacy and exposure surface audit tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CipherGreyLabs"}
]
keywords = ["kali", "linux", "privacy", "opsec", "audit", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0,<16"
]

[project.urls]
Repository = "https://github.com/CipherGreyLabs/KOAF"
Issues = "https://github.com/CipherGreyLabs/KOAF/issues"

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.1,<3",
    "pytest>=8.0.0,<10",
    "ruff>=0.6.0,<1"
]

[project.scripts]
koaf = "koaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
