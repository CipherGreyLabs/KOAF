name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev]

      - name: Compile Python files
        run: python -m compileall src/koaf

      - name: Run lint checks
        run: ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Audit Python dependencies
        # Audit only this project's dependency graph. Auditing the complete
        # runner environment can report unrelated preinstalled packages.
        run: python -m pip_audit . --progress-spinner off

      - name: Run static security analysis
        if: ${{ always() }}
        run: python -m bandit -q -r src/koaf
